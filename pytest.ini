[pytest]
# 测试文件位置
testpaths = tests

# 收集时忽略归档的旧 reqres 用例
norecursedirs = legacy_reqres

# 文件命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 注册标签
markers =
    smoke: 冒烟测试
    regression: 回归测试
    ruoyi: 若依后台相关用例（CI 环境跳过）

# 默认运行参数：详细模式 + 显示 print 输出
addopts = -v -s --html=reports/report.html --self-contained-html